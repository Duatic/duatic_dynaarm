name: Nightly image
on:
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "Comma-separated distros to build, e.g. 'jazzy,kilted'. Empty builds the factory's default set."
        default: ""
      publish:
        description: "Push the images to ghcr.io"
        type: boolean
        default: false
  schedule:
    - cron: "0 1 * * *"
      timezone: "Europe/Zurich"

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: Duatic/duatic_docker_image/.github/workflows/nightly.yml@v1
    with:
      product: dynaarm
      ros_distro: ${{ inputs.ros_distro }}
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
    secrets: inherit
